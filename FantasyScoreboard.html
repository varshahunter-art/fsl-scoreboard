<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablocos Scoreboard · Fantasy Sales League Dashboard Extension</title>
<style>
:root{
  --bg:#0a0e14; --panel:#121824; --panel2:#0e1420; --line:#1f2a3a;
  --ink:#e8eef7; --dim:#8493ab; --dim2:#55637a;
  --gold:#e0b357; --pos:#35d07f; --neg:#ff5c5c; --zero:#55637a;
  --backink:#241608;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:
    radial-gradient(1200px 500px at 50% -10%,rgba(224,179,87,.06),transparent 60%),
    var(--bg);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:0 0 40px;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

.topbar{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0e1420,#0a0e14);position:sticky;top:0;z-index:50}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:52px}
.brand{font-weight:800;letter-spacing:.08em;font-size:14px;text-transform:uppercase}
.brand .accent{color:var(--gold)}
.back{margin-left:auto;background:#fff;color:#0e1420;border:1px solid #fff;border-radius:6px;padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer;display:none;transition:background .18s,box-shadow .18s,transform .18s}
.back:hover{background:#f4f7fb;box-shadow:0 2px 14px rgba(255,255,255,.28);transform:translateY(-1px)}

.hero{padding:24px 0 16px;border-bottom:1px solid var(--line)}
.hero .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px}
.hero h1{font-size:26px;font-weight:900;letter-spacing:-.02em}
.hero .sub{color:var(--dim);font-size:13px;margin-top:4px;font-weight:600}
.toolbar{display:flex;justify-content:flex-end;margin-top:16px;margin-bottom:4px}
.toolbar button{display:inline-flex;align-items:center;gap:9px;font:inherit;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#0e1420;background:var(--gold);border:1px solid #f0c877;border-radius:9px;padding:10px 18px;cursor:pointer;box-shadow:0 6px 20px rgba(224,179,87,.4);transition:background .15s,border-color .15s,box-shadow .15s,transform .15s}
.toolbar button svg{width:16px;height:16px;display:block}
.toolbar button:hover{background:#f0c877;box-shadow:0 6px 22px rgba(224,179,87,.45);transform:translateY(-1px)}
.toolbar button.on{background:var(--panel);border-color:var(--gold);color:var(--gold);box-shadow:0 4px 16px rgba(0,0,0,.35)}

#leagueView{padding-top:22px}

.agg{margin-top:0;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--panel2));padding:18px 20px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.agg-top{display:flex;align-items:center;gap:16px}
.agg-id{display:flex;flex-direction:column;gap:3px;min-width:0}
.agg-title{font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;color:var(--ink);line-height:1}
.agg-sub{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.agg-tot{margin-left:auto;text-align:right;flex:0 0 auto}
.agg-tot .l{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
.agg-tot .n{font-size:26px;font-weight:900;letter-spacing:-.02em;color:var(--pos);line-height:1.05;margin-top:2px;text-transform:uppercase}
.agg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:16px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.agg-stat{background:var(--panel);padding:12px 14px}
.agg-stat .k{font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.agg-stat .v{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink);margin-top:4px}
.part-panel{grid-column:span 2;background:var(--panel);padding:14px}
.part-panel .ph{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.part-panel .pt{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.part-panel .pd{color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.03em;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;color:var(--ink)}
.part-empty{color:var(--ink);font-size:18px;font-weight:900;letter-spacing:-.02em;padding:2px 0}
@media(max-width:600px){.agg-grid{grid-template-columns:1fr 1fr}.part-panel{grid-column:span 2}}

.standings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:18px}
@media(max-width:820px){.standings{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.standings{grid-template-columns:minmax(0,1fr)}}

.flip{position:relative;perspective:1400px;cursor:pointer;aspect-ratio:5 / 7}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.15,.25,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:5px;overflow:hidden;display:flex;flex-direction:column}
.front{background:#f4ecd8}
.front-inner{position:relative;flex:1;display:flex;flex-direction:column;padding:10px;margin:0;
  background:
    repeating-linear-gradient(90deg,rgba(120,90,50,.06) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(0deg,rgba(120,90,50,.06) 0 1px,transparent 1px 26px),
    #f4ecd8;
  border:9px solid #f4ecd8}
.front-photo{position:absolute;left:52px;right:12px;top:12px;bottom:64px;border-radius:3px;overflow:hidden;
  background:linear-gradient(160deg,var(--tc) 0%,var(--tc2) 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.front-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.front-photo.empty::after{content:"PHOTO";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;letter-spacing:.3em;color:rgba(255,255,255,.55)}
.front-rank{position:absolute;top:-20px;right:-20px;z-index:20;width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;font-style:italic;letter-spacing:-.01em;color:#fff;
  background:var(--tc);border:3px solid #f4ecd8;transition:opacity .3s}
.flip.flipped .front-rank{opacity:0;pointer-events:none}
.flip.ir .face.front{filter:grayscale(1);opacity:.5}
.flip.ir .front-rank.ir-badge{background:#4a4a4a;border-color:#d8cdb4;color:#f4ecd8;font-style:normal;letter-spacing:.04em}
.flip.ir .back-total .ir-tn{font-style:normal;letter-spacing:.04em;color:#b23a2e}
.flip.ir .ir-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;padding:22px 16px;text-align:center;gap:14px}
.flip.ir .ir-panel .ir-cross{font-size:52px;line-height:1;color:#b23a2e}
.flip.ir .ir-panel .ir-title{font-size:28px;font-weight:900;font-style:italic;line-height:.95;
  letter-spacing:.01em;text-transform:uppercase;color:#b23a2e}
.front-team{position:absolute;left:0;width:40px;top:12px;bottom:12px;z-index:3;
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;transform:rotate(180deg);transform-origin:center;
  font-weight:900;font-style:italic;line-height:1;letter-spacing:-.04em;text-transform:uppercase;
  white-space:nowrap;overflow:visible;color:var(--tc)}
.front-team span{display:block;transform-origin:center}
.front-score{position:absolute;left:52px;right:16px;bottom:13px;z-index:4}
.front-score .scores{display:flex;flex-direction:row;align-items:flex-end;justify-content:space-between;gap:8px}
.front-score .scores.single{justify-content:flex-end}
.front-score .scores.single .sc.tot .n{font-size:32px}
.front-score .sc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1;min-width:0}
.front-score .sc.tot{align-items:flex-end;text-align:right}
.front-score .l{font-size:8.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(60,40,20,.7)}
.front-score .n{font-size:30px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;line-height:1;color:var(--tc2);opacity:.82}
.front-score .sc.mo .n{font-size:18px}
.front-score .sc.tot .n{font-size:32px;color:var(--tc);opacity:1}

.back-face{transform:rotateY(180deg);color:var(--backink);
  background:
    repeating-linear-gradient(90deg,rgba(120,90,50,.06) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(0deg,rgba(120,90,50,.06) 0 1px,transparent 1px 26px),
    #f4ecd8}
.back-head{background:var(--tc);padding:12px 14px 10px;display:flex;align-items:center;position:relative;overflow:hidden;flex:0 0 auto;border-bottom:3px solid var(--tc2)}
.back-team{font-size:24px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.03em;line-height:.95;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.lineup{display:flex;flex-direction:column;flex:1;min-height:0}
.lu-row{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:10px;padding:0 14px;flex:1;border-top:1px solid rgba(120,90,50,.16)}
.lu-row:first-child{border-top:0}
.lu-pos{font-size:10px;font-weight:900;letter-spacing:.02em;text-align:center;color:var(--tc);background:transparent;border:1.5px solid rgba(120,90,50,.32);border-radius:5px;padding:4px 3px;white-space:nowrap}
.lu-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--backink)}
.lu-score{font-size:13px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:right}
.lu-score.pos{color:var(--tc)} .lu-score.neg{color:#b23a2e} .lu-score.zero{color:#8a7355}
.back-total{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--tc);border-top:3px solid var(--tc2);flex:0 0 auto}
.back-total .tl{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.back-total .tn{font-size:20px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.lu-row:hover,.lu-row:focus-visible{background:rgba(120,90,50,.1);outline:none;cursor:pointer}
.lu-popout{position:absolute;top:0;left:calc(100% + 16px);width:290px;z-index:40;opacity:0;visibility:hidden;transform:translateX(-8px);transition:opacity .16s ease,transform .16s ease;pointer-events:none;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.lu-popout.show{opacity:1;visibility:visible;transform:translateX(0);pointer-events:auto}
.flip.pop-left .lu-popout{left:auto;right:calc(100% + 16px);transform:translateX(8px)}
.flip.pop-left .lu-popout.show{transform:translateX(0)}
.flip.popping{z-index:120}
.flip.pop-active{z-index:400}
.standings.dimmed .flip:not(.popping){opacity:.32;filter:saturate(.6);transition:opacity .2s ease,filter .2s ease}
.standings .flip{transition:opacity .2s ease,filter .2s ease}
@media(max-width:600px){.lu-popout,.flip.pop-left .lu-popout{left:auto;right:calc(100% + 16px)}}

#teamView{display:none}
.team-hero{padding:24px 22px 20px;border:4px solid var(--th);border-radius:8px;position:relative;overflow:hidden;color:#3c2814;
  background:
    repeating-linear-gradient(90deg,rgba(120,90,50,.06) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(0deg,rgba(120,90,50,.06) 0 1px,transparent 1px 26px),
    #f4ecd8;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.th-top{display:flex;align-items:center;gap:20px;position:relative}
.th-name{font-size:40px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.03em;line-height:.92;color:var(--th)}
.th-cap{color:rgba(60,40,20,.7);font-size:16px;font-weight:700;margin-top:6px}
.th-total{margin-left:auto;text-align:right}
.th-total .n{font-size:42px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--th)}
.th-total .l{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(60,40,20,.6)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-top:22px}
.card{position:relative;border-radius:6px;padding:0;overflow:hidden;color:#3c2814;
  background:
    repeating-linear-gradient(90deg,rgba(120,90,50,.06) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(0deg,rgba(120,90,50,.06) 0 1px,transparent 1px 26px),
    #f4ecd8;
  border:4px solid var(--tc);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card-head{padding:0;background:var(--tc);border-bottom:3px solid var(--tc2)}
.card-head .who{padding:12px 16px 11px;display:flex;flex-direction:column;gap:3px}
.who .name{font-size:24px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.02em;line-height:.95;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.who .role{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.score-strip{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 10px;border-bottom:2px solid rgba(120,90,50,.22)}
.score-strip .big{font-size:32px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--tc)}
.score-strip .big.neg{color:#b23a2e} .score-strip .big.zero{color:#8a7355}
.score-strip .unit{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(60,40,20,.65)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:2px solid rgba(120,90,50,.22)}
.stat{padding:9px 16px;border-right:1px solid rgba(120,90,50,.18);border-bottom:1px solid rgba(120,90,50,.18)}
.stat:nth-child(2n){border-right:0}
.stat:nth-last-child(-n+2){border-bottom:0}
.stat .k{font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(60,40,20,.6)}
.stat .v{font-size:15px;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums;color:#3c2814}
.bars{padding:12px 16px 4px;display:flex;flex-direction:column;gap:10px}
.kpi-row .bl,.bar-row .bl{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;margin-bottom:5px;text-transform:uppercase}
.kpi-row .bl .bn,.bar-row .bl .bn{color:rgba(60,40,20,.62)}
.kpi-row .bl .bv,.bar-row .bl .bv{font-variant-numeric:tabular-nums;color:#3c2814}
.trk{height:7px;background:rgba(120,90,50,.16);border-radius:4px;overflow:hidden}
.fil{height:100%;border-radius:4px}
.pips{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pip{width:9px;height:9px;border-radius:50%;background:rgba(120,90,50,.16);box-shadow:inset 0 0 0 1px rgba(120,90,50,.22)}
.pip.on{background:var(--tc);box-shadow:none}
.pip-zero{font-size:9px;font-weight:800;letter-spacing:.03em;color:rgba(60,40,20,.42);text-transform:none;font-style:italic}
.chk-wrap{display:flex;align-items:center}
.chk{flex:0 0 auto;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;line-height:1}
.chk.pass{color:var(--tc);background:rgba(120,90,50,.08);box-shadow:inset 0 0 0 1.5px var(--tc)}
.chk.fail{color:#b23a2e;background:rgba(178,58,46,.08);box-shadow:inset 0 0 0 1.5px rgba(178,58,46,.55)}
.lines{padding:10px 16px 11px;display:flex;flex-direction:column;gap:7px}
.line-item{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px}
.line-item .desc{color:rgba(60,40,20,.72);font-weight:700;line-height:1.3}
.line-item .pts{font-weight:900;font-variant-numeric:tabular-nums;flex:0 0 auto}
.line-item .pts.p{color:var(--tc)} .line-item .pts.m{color:#b23a2e}
.line-item .pts:not(.p):not(.m){color:rgba(60,40,20,.55)}
.rules{margin:0 16px 14px;padding:10px 12px;border:1.5px dashed rgba(120,90,50,.3);border-radius:8px;background:rgba(120,90,50,.05);display:flex;flex-direction:column;gap:5px}
.rules-hd{font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--tc);opacity:.85;margin-bottom:2px}
.rule-item{font-size:10.5px;font-weight:700;line-height:1.35;color:rgba(60,40,20,.66);padding-left:12px;position:relative}
.rule-item::before{content:"›";position:absolute;left:0;top:-1px;color:var(--tc);font-weight:900}

.footnote{color:var(--dim2);font-size:12px;text-align:center;margin-top:30px;line-height:1.6;padding:0 20px}

@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <div class="brand">Fantasy <span class="accent">Sales League</span></div>
  <button class="back" id="backBtn">← League</button>
</div></div>

<div id="leagueView">
  <div class="hero"><div class="wrap">
    <div>
      <h1>Tablocos Scoreboard</h1>
      <div class="sub" id="heroSub">&nbsp;</div>
    </div>
  </div></div>

  <div class="wrap">
    <div id="aggBanner"></div>
    <div class="toolbar"><button id="flipAllBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a9 9 0 0 0-15.5-4.5L3 6"/><path d="M3 3v3h3"/><path d="M3 16a9 9 0 0 0 15.5 4.5L21 18"/><path d="M21 21v-3h-3"/></svg><span class="fa-label">Flip All</span></button></div>
    <div id="standings" class="standings"></div>
    <div id="footnote" class="footnote"></div>
  </div>
</div>

<div id="teamView">
  <div class="wrap">
    <div class="team-hero">
      <div class="th-top">
        <div>
          <div class="th-name" id="thName"></div>
          <div class="th-cap" id="thCap"></div>
        </div>
        <div class="th-total"><div class="n" id="thTotal"></div><div class="l">Total Points</div></div>
      </div>
    </div>
    <div class="grid" id="roster"></div>
    <div class="footnote" id="teamFoot"></div>
  </div>
</div>

<script src="./lib/tableau.extensions.1.latest.js"></script>
<script src="./scoring.js"></script>
<script>
// ========================================================================
// Fantasy Sales League — Tableau Dashboard Extension
// ========================================================================
// Preserves the flip-card scoreboard + team-detail drill-in from index.html.
// Boots against the Tableau Extensions API, reads raw metrics from a
// worksheet named `FSL Metrics` (or falls back to bundled staging), and
// runs scoring.js in-browser to compute the standings.
//
// The dropped features vs. the standalone app (mostly things that don't
// apply inside a single dashboard tile):
//   - month/season tabs at the top (extension is scoped to one month)
//   - powered-by-Tableau badge (we're inside Tableau already)
//   - data-audit view (raw metrics live in the Tableau worksheet itself)
// ========================================================================

// Extension config: worksheet name to read metrics from, month meta, and
// the two mappings the live-data path needs.
const METRICS_WORKSHEET = 'FSL Metrics';
const MONTH_ID = '2026-09';
const MONTH_META = { id: MONTH_ID, label: 'September', fyLabel: 'FY2027', status: 'open', locked: false };

const NAME_MAP = { 'Araceli Hernandez': 'Araceli Murray' };

const COLUMN_MAP = {
  'Specialist User Name':  '__name__',
  'Closed Won Amount':     'closed_won_amount',
  'Deal Count':            'deal_count',
  'Distinct Customers':    'distinct_customers',
  'Pipe Gen Amount':       'pipe_gen_amount',
  'Create & Close Amount': 'create_close_amount',
  'Create & Close Deals':  'create_close_deals',
  'Fast Closes':           'fast_closes',
  'Flex Credit Amount':    'flex_credit_amount',
  'Big Bets':              'big_bets',
  'ACV Above 50K':         'acv_above_50k',
  'Top Deal':              'top_deal_amount',
  'Smallest Deal':         'smallest_deal_amount',
  'Tagged Plays':          'tagged_plays',
  'Upgrades':              'upgrades',
  'Capacity Upgrades':     'capacity_upgrades',
};

// --- Data model (single month; season/multi-month collapse to one entry) ----
let PHOTOS = {};
let TEAMS = [];
let MONTHS = [];
let VIEW = { monthIdx: 0, season: false };
let DATA_SOURCE = '';

function teamByKey(key){ return TEAMS.find(t => t.key === key) || {}; }
function standingFor(monthIdx, key){
  const m = MONTHS[monthIdx];
  return m ? (m.standings.find(s => s.key === key) || null) : null;
}
function monthTotal(monthIdx, key){
  const st = standingFor(monthIdx, key);
  return st ? st.total : 0;
}
function seasonTotal(key){ return monthTotal(0, key); }
function latestRosterMonthIdx(){ return 0; }
function currentSeasonMonthIdx(){ return 0; }
function currentSeasonLabel(){ return MONTH_META.label; }
function viewedMonthLabel(){ return MONTH_META.label; }

function fmtScore(s){ return (s > 0 ? '+' : '') + Number(s).toFixed(2); }
function scoreClass(s){ return s > 0 ? 'pos' : (s < 0 ? 'neg' : 'zero'); }

// Full scoring rules per position — matches score.py / scoring.js.
const RULES = {
  QB:['1 pt per $10K closed-won ACV','5 pts per distinct customer closed','-20 pts if pipe gen under $100K'],
  RB:['1 pt per $1K create-and-close ACV','25 pts per deal closed before the 21st','1 pt per $5K of flex credit ACV'],
  WR:['30 pts per deal over $50K','1 pt per $1K ACV above $50K'],
  TE:[{text:'25 pts per team play deal',chips:['#embed&scale','#CSAnalytics','#SFPOC','#CustomerPOC']},'10 pts per Tableau+ or Cloud+ upgrade','25 pts per capacity licensing upgrade'],
  K :['Start with 20 pts','-20 pts if under $25K closed for the month, -50 pts if under $10K closed for the month'],
  DEF:['Start with 30 pts','-30 under $100K pipe, -60 under $50K, -90 at $0']
};
function rulesFor(c){
  let p = c.pos;
  if (p === 'FLEX'){ const m = /\(([^)]+)\)/.exec(c.role); p = m ? m[1] : p; }
  return RULES[p] || [];
}

const KPI_COUNTS = ['Customers','Fast closes < 21st','Team plays','Upgrades','Big bets'];
const KPI_BINARY = ['Participation floor','Pipe vs $100K floor'];
function kpiKind(label){
  if (KPI_BINARY.indexOf(label) >= 0) return 'binary';
  if (KPI_COUNTS.indexOf(label) >= 0) return 'count';
  return 'bar';
}

function playerCardHTML(c, t){
  const tc = (t && t.c1) || c.color;
  const tc2 = (t && t.c2) || c.color;
  const statsHtml = c.stats.map(s => `<div class="stat"><div class="k">${s[0]}</div><div class="v">${s[1]}</div></div>`).join('');
  const barsHtml = c.bars.map(b => {
    const label = b[0], val = b[1], max = b[2];
    const kind = kpiKind(label);
    if (kind === 'count'){
      const n = Math.max(0, Math.round(val));
      const pips = [];
      for (let d = 0; d < n; d++) pips.push('<span class="pip on"></span>');
      const body = n > 0 ? pips.join('') : '<span class="pip-zero">none this month</span>';
      return `<div class="kpi-row"><div class="bl"><span class="bn">${label}</span></div><div class="pips">${body}</div></div>`;
    }
    if (kind === 'binary'){
      const pass = (label.indexOf('Participation') >= 0) ? val >= max : val >= 100000;
      return `<div class="kpi-row"><div class="bl"><span class="bn">${label}</span></div><div class="chk-wrap"><span class="chk ${pass?'pass':'fail'}">${pass?'✓':'✕'}</span></div></div>`;
    }
    const pct = Math.max(3, Math.min(100, Math.round((val / max) * 100)));
    return `<div class="kpi-row"><div class="bl"><span class="bn">${label}</span></div><div class="trk"><div class="fil" style="width:${pct}%;background:${tc}"></div></div></div>`;
  }).join('');
  const linesHtml = c.lines.map(l => `<div class="line-item"><span class="desc">${l[0]}</span><span class="pts ${l[2]}">${l[1]}</span></div>`).join('');
  const rulesHtml = rulesFor(c).map(r => {
    if (typeof r === 'object') return `<div class="rule-item">${r.text} ${r.chips.join(' / ')}</div>`;
    return `<div class="rule-item">${r}</div>`;
  }).join('');
  return `<div class="card" style="--tc:${tc};--tc2:${tc2}">
    <div class="card-head"><div class="who"><div class="name">${c.name}</div><div class="role">${c.role}</div></div></div>
    <div class="score-strip"><span class="big ${scoreClass(c.score)}">${fmtScore(c.score)}</span><span class="unit">Points</span></div>
    <div class="stats">${statsHtml}</div>
    <div class="bars">${barsHtml}</div>
    <div class="lines">${linesHtml}</div>
    <div class="rules"><div class="rules-hd">Scoring</div>${rulesHtml}</div>
  </div>`;
}

function cardHTML(row, i, rank){
  const t = teamByKey(row.key);
  const photo = PHOTOS[row.key];
  const inactive = !!row.inactive;
  const r = (rank != null ? rank : i);
  const rankTxt = ['1ST','2ND','3RD','4TH','5TH','6TH','7TH'][r] || ((r+1) + 'TH');
  const rows = (row.roster || []).map((c, ci) => {
    const m = c.pos === 'FLEX' && /\(([^)]+)\)/.exec(c.role);
    const posLabel = m ? `Flex ${m[1]}` : c.pos;
    return `<div class="lu-row${c.pos==='FLEX'?' flex':''}" data-idx="${ci}" tabindex="0">
      <div class="lu-pos">${posLabel}</div>
      <div class="lu-name">${c.name}</div>
      <div class="lu-score ${scoreClass(c.score)}">${fmtScore(c.score)}</div>
    </div>`;
  }).join('');
  const mTotal = row.total;
  const dash = '<span class="n">&ndash;</span>';
  const scoresHtml = inactive
    ? `<div class="scores single"><div class="sc tot"><span class="l">Inactive</span>${dash}</div></div>`
    : `<div class="scores">
         <div class="sc tot"><span class="l">${viewedMonthLabel()}</span><span class="n">${mTotal.toFixed(2)}</span></div>
       </div>`;
  const backTotalHtml = inactive
    ? `<div class="tl">Status</div><div class="tn ir-tn">IR</div>`
    : `<div class="tl">${viewedMonthLabel()}</div><div class="tn">${mTotal.toFixed(2)}</div>`;
  const lineupHtml = inactive
    ? `<div class="ir-panel"><div class="ir-cross">✚</div><div class="ir-title">Injured<br>Reserve</div></div>`
    : rows;
  return `<div class="flip${inactive?' ir':''}" style="--tc:${t.c1};--tc2:${t.c2}" data-key="${row.key}"${inactive?' data-inactive="1"':''}>
    <div class="flip-inner">
      <div class="face front">
        <div class="front-inner">
          <div class="front-photo${photo?'':' empty'}">${photo?`<img src="${photo}" alt="${t.captain||''}">`:''}</div>
          <div class="front-team"><span>${t.team}</span></div>
          <div class="front-score">${scoresHtml}</div>
        </div>
      </div>
      <div class="face back-face">
        <div class="back-head"><div class="back-team">${t.team}</div></div>
        <div class="lineup">${lineupHtml}</div>
        <div class="back-total">${backTotalHtml}</div>
      </div>
    </div>
    ${inactive?`<div class="front-rank ir-badge">IR</div>`:`<div class="front-rank">${rankTxt}</div>`}
  </div>`;
}

function renderStandings(){
  const el = document.getElementById('standings');
  el.classList.remove('single','dimmed');
  const fb = document.getElementById('flipAllBtn');
  if (fb){ fb.querySelector('.fa-label').textContent = 'Flip All'; fb.classList.remove('on'); }

  const rows = (MONTHS[VIEW.monthIdx] ? MONTHS[VIEW.monthIdx].standings : []).slice();
  rows.sort((a, b) => (a.inactive?1:0) - (b.inactive?1:0) || b.total - a.total);

  const active = rows.filter(r => !r.inactive);
  const counts = {};
  active.forEach(r => { const k = r.total.toFixed(4); counts[k] = (counts[k]||0) + 1; });

  el.innerHTML = rows.map(row => {
    if (row.inactive) return cardHTML(row, null, null);
    const higher = active.filter(r => r.total > row.total + 1e-9).length;
    return cardHTML(row, higher, higher);
  }).join('');

  el.querySelectorAll('.flip').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.lu-row')){ e.stopPropagation(); showTeam(card.dataset.key); return; }
      const nowFlipped = card.classList.toggle('flipped');
      card.classList.toggle('popping', nowFlipped);
      el.classList.toggle('dimmed', !!el.querySelector('.flip.flipped'));
      const b = document.getElementById('flipAllBtn');
      if (b){
        const cards = [...el.querySelectorAll('.flip')];
        const allFlipped = cards.length > 0 && cards.every(c => c.classList.contains('flipped'));
        b.querySelector('.fa-label').textContent = allFlipped ? 'Unflip All' : 'Flip All';
        b.classList.toggle('on', allFlipped);
      }
    });
  });
  wirePopouts(el);
  fitTeamNames(el);

  const flipAllBtn = document.getElementById('flipAllBtn');
  if (flipAllBtn){
    flipAllBtn.onclick = () => {
      const cards = [...el.querySelectorAll('.flip')];
      const anyUnflipped = cards.some(c => !c.classList.contains('flipped'));
      cards.forEach(c => {
        c.classList.toggle('flipped', anyUnflipped);
        c.classList.toggle('popping', anyUnflipped);
      });
      el.classList.toggle('dimmed', anyUnflipped);
      flipAllBtn.querySelector('.fa-label').textContent = anyUnflipped ? 'Unflip All' : 'Flip All';
      flipAllBtn.classList.toggle('on', anyUnflipped);
    };
  }
}

function fitTeamNames(scope){
  scope.querySelectorAll('.front-team').forEach(box => {
    const span = box.querySelector('span');
    if (!span) return;
    const avail = box.clientHeight - 6;
    if (avail <= 0) return;
    span.style.fontSize = '';
    let size = 44;
    span.style.fontSize = size + 'px';
    let guard = 0;
    while (span.offsetHeight > avail && size > 16 && guard++ < 60){ size -= 1; span.style.fontSize = size + 'px'; }
  });
}
window.addEventListener('load', () => fitTeamNames(document));
let _fitRAF;
window.addEventListener('resize', () => { cancelAnimationFrame(_fitRAF); _fitRAF = requestAnimationFrame(() => fitTeamNames(document)); });

function wirePopouts(scope){
  scope.querySelectorAll('.flip').forEach(card => {
    const key = card.dataset.key;
    const t = teamByKey(key);
    const st = standingFor(VIEW.monthIdx, key);
    const back = card.querySelector('.back-face');
    if (!back || !t || !st) return;
    const pop = document.createElement('div');
    pop.className = 'lu-popout';
    card.appendChild(pop);
    let hideTimer = null;
    const show = row => {
      clearTimeout(hideTimer);
      const c = st.roster[+row.dataset.idx];
      if (!c) return;
      pop.innerHTML = playerCardHTML(c, t);
      const cr = card.getBoundingClientRect();
      const roomRight = window.innerWidth - cr.right;
      card.classList.toggle('pop-left', roomRight < 320);
      pop.style.top = '0px';
      pop.classList.add('show');
      scope.querySelectorAll('.flip.pop-active').forEach(c => { if (c !== card) c.classList.remove('pop-active'); });
      card.classList.add('pop-active');
    };
    const hide = () => { hideTimer = setTimeout(() => { pop.classList.remove('show'); card.classList.remove('pop-active'); }, 90); };
    back.querySelectorAll('.lu-row').forEach(row => {
      row.addEventListener('mouseenter', () => show(row));
      row.addEventListener('mouseleave', hide);
      row.addEventListener('focus',      () => show(row));
      row.addEventListener('blur',       hide);
    });
    pop.addEventListener('mouseenter', () => clearTimeout(hideTimer));
    pop.addEventListener('mouseleave', hide);
  });
}

function showTeam(key){
  const t = teamByKey(key);
  const st = standingFor(VIEW.monthIdx, key);
  const roster = st ? st.roster : [];
  const headTotal = st ? st.total : 0;
  document.getElementById('leagueView').style.display = 'none';

  document.documentElement.style.setProperty('--th', t.c1);
  document.documentElement.style.setProperty('--th2', t.c2);

function showLeague(){
  document.getElementById('teamView').style.display = 'none';
  document.getElementById('leagueView').style.display = 'block';
  document.getElementById('backBtn').style.display = 'none';
  const lv = document.getElementById('leagueView');

  lv.querySelectorAll('.lu-popout.show').forEach(p => p.classList.remove('show'));
  const std = lv.querySelector('.standings');

  const b = document.getElementById('flipAllBtn');

}
document.getElementById('backBtn').addEventListener('click', showLeague);

// --- Aggregate banner + participation panels --------------------------------
function fmtPipe(v){
  if (!v) return '$0';
  if (v >= 1_000_000) return '$' + (v/1_000_000).toFixed(v % 1_000_000 ? 1 : 0) + 'M';
  if (v >= 1_000)     return '$' + Math.round(v/1_000) + 'K';
  return '$' + v;
}
function renderAggBanner(){
  const m = MONTHS[VIEW.monthIdx];
  const rows = (m ? m.standings : []).slice();
  const active = rows.filter(r => !r.inactive).sort((a, b) => b.total - a.total);
  const leader = active[0] || rows[0] || { key: '', roster: [] };
  const leaderTeam = teamByKey(leader.key);
  const tt = m && m.teamTotals ? m.teamTotals : null;
  const rev  = tt ? fmtPipe(Math.round(tt.revenue))    : '–';
  const pipe = tt ? fmtPipe(Math.round(tt.pipeGen))    : '–';
  const cust = tt ? String(tt.customers)               : '–';
  const cc   = tt ? fmtPipe(Math.round(tt.createClose)): '–';
  const sub = `Fantasy Scorecard · ${m ? `${m.meta.label} ${m.meta.fyLabel}` : ''}`;
  document.getElementById('aggBanner').innerHTML = `
    <div class="agg">
      <div class="agg-top">
        <div class="agg-id">
          <div class="agg-title">Tablocos</div>
          <div class="agg-sub">${sub}</div>
        </div>
        <div class="agg-tot">
          <div class="l">${m?`${m.meta.label} Leader`:'Leader'}</div>
          <div class="n">${leaderTeam.captain||''}</div>
        </div>
      </div>
      <div class="agg-grid">
        <div class="agg-stat"><div class="k">Revenue Closed</div><div class="v">${rev}</div></div>
        <div class="agg-stat"><div class="k">Pipe Generated</div><div class="v">${pipe}</div></div>
        <div class="agg-stat"><div class="k">Distinct Customers</div><div class="v">${cust}</div></div>
        <div class="agg-stat"><div class="k">Create and Close</div><div class="v">${cc}</div></div>
        ${participationPanels()}
      </div>
    </div>`;
}
function participationPanels(){
  const m = MONTHS[VIEW.monthIdx];
  const reps = m && m.reps ? m.reps : [];
  const acv  = reps.filter(r => (r.acvClosed||0) >= 25000).map(r => r.name).sort();
  const pipe = reps.filter(r => (r.pipeGen||0)   >= 100000).map(r => r.name).sort();
  const panel = (title, desc, names) => {
    const body = names.length
      ? `<div class="chips">${names.map(n => `<span class="chip">${n}</span>`).join('')}</div>`
      : `<div class="part-empty">&ndash;</div>`;
    return `<div class="part-panel"><div class="ph"><span class="pt">${title}</span></div>
      <div class="pd">${desc}</div>${body}</div>`;
  };
  return panel('ACV Participation Met',      'Closed ≥ $25K ACV this month', acv)
       + panel('Pipe Gen Participation Met', 'Generated ≥ $100K pipe gen this month', pipe);
}

function renderFootnote(){

    QB rewards revenue and distinct customers · RB rewards create-and-close velocity · WR rewards big bets over $50K · TE rewards team plays and upgrades · K is participation · DEF is pipe generation.<br>
    <span style="color:var(--dim2);opacity:.8">Data source: ${escapeHtml(DATA_SOURCE)}</span>`;
}

function renderHeroSub(){

}

}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Live Tableau data path -------------------------------------------------
async function stagingFromWorksheet(ws){
  const table = await ws.getSummaryDataAsync({ ignoreSelection: true });
  const cols = table.columns;
  const idxByStagingKey = {};
  for (const c of cols){
    const mapped = COLUMN_MAP[c.fieldName];
    if (mapped) idxByStagingKey[mapped] = c.index;
  }
  if (idxByStagingKey.__name__ == null){
    throw new Error(`worksheet is missing a "Specialist User Name" column (found: ${cols.map(c => c.fieldName).join(', ')})`);
  }
  const staging = {};
  for (const row of table.data){
    const rawName = row[idxByStagingKey.__name__].formattedValue;
    const appName = NAME_MAP[rawName] || rawName;
    if (!appName) continue;
    const entry = staging[appName] || (staging[appName] = {});
    for (const [key, idx] of Object.entries(idxByStagingKey)){
      if (key === '__name__') continue;
      const cell = row[idx];
      const n = Number(cell.nativeValue != null ? cell.nativeValue : cell.value);
      entry[key] = Number.isFinite(n) ? (entry[key]||0) + n : (entry[key]||0);
    }
  }
  return staging;
}

// Derive the aggregate banner inputs (teamTotals + reps for participation) from staging.
function deriveTeamTotals(staging){
  let revenue = 0, customers = 0, createClose = 0, pipeGen = 0;
  for (const m of Object.values(staging)){
    if (!m || m.inactive) continue;
    revenue     += m.closed_won_amount   || 0;
    customers   += m.distinct_customers  || 0;
    createClose += m.create_close_amount || 0;
    pipeGen     += m.pipe_gen_amount     || 0;
  }
  return { revenue, customers, createClose, pipeGen };
}
function deriveReps(staging){
  return Object.entries(staging)
    .filter(([_, m]) => m && !m.inactive)
    .map(([name, m]) => ({ name, acvClosed: m.closed_won_amount||0, pipeGen: m.pipe_gen_amount||0 }));
}

// --- Boot -------------------------------------------------------------------
async function boot(){
  if (!window.tableau || !tableau.extensions){
    throw new Error('Tableau Extensions API not found — open this URL inside a Tableau dashboard, not directly in a browser.');
  }
  await tableau.extensions.initializeAsync();

  const dashboard = tableau.extensions.dashboardContent.dashboard;

  const [teams, photos, monthTemplate] = await Promise.all([
    fetch('./teams.json').then(r => r.json()),
    fetch('./photos.json').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch(`./month-${MONTH_ID}.json`).then(r => r.json()),
  ]);
  TEAMS = teams;
  PHOTOS = photos;

  const metricsWs = dashboard.worksheets.find(w => w.name === METRICS_WORKSHEET);

  async function refresh(){
    let staging, source;
    if (metricsWs){
      try {
        staging = await stagingFromWorksheet(metricsWs);
        source  = `live from Tableau worksheet "${METRICS_WORKSHEET}"`;
      } catch (err){
        console.error('live pull failed, falling back:', err);
        staging = await fetch(`./staging-${MONTH_ID}.json`).then(r => r.json());
        source  = `bundled staging (live pull failed: ${err.message || err})`;
      }
    } else {
      staging = await fetch(`./staging-${MONTH_ID}.json`).then(r => r.json());
      source  = `bundled staging (no "${METRICS_WORKSHEET}" worksheet on this dashboard)`;
    }
    const month = FSLScoring.scoreMonth(staging, monthTemplate);
    month.meta       = MONTH_META;
    month.teamTotals = deriveTeamTotals(staging);
    month.reps       = deriveReps(staging);
    MONTHS = [month];
    VIEW = { monthIdx: 0, season: false };
    DATA_SOURCE = source;
    applyView();
  }

  if (metricsWs){
    metricsWs.addEventListener(tableau.TableauEventType.FilterChanged,        refresh);
    metricsWs.addEventListener(tableau.TableauEventType.MarkSelectionChanged, refresh);
    metricsWs.addEventListener(tableau.TableauEventType.SummaryDataChanged,   refresh);
  }
  await refresh();
}
boot().catch(err => {
  console.error(err);
  document.body.innerHTML = `<div style="padding:24px;color:#ff5c5c;font-family:sans-serif">
    <h2 style="color:#e0b357;margin-bottom:8px">Fantasy Sales League — boot failed</h2>
    <p style="color:#e8eef7">${escapeHtml(err && err.message || String(err))}</p>
  </div>`;
});
